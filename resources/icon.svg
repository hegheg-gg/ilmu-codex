  <!-- Center Brain / Node Circuit -->
  <circle cx="64" cy="50" r="5" fill="#38BDF8" />
  <circle cx="56" cy="74" r="4.5" fill="#60A5FA" />
  <circle cx="72" cy="74" r="4.5" fill="#06B6D4" />
  
  <line x1="64" y1="50" x2="56" y2="74" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />
  <line x1="64" y1="50" x2="72" y2="74" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />
  <line x1="56" y1="74" x2="72" y2="74" stroke="#93C5FD" stroke-width="2" stroke-dasharray="2 3" />
